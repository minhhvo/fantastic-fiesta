services:
  workspace:
    container_name: minhhvo
    image: baseworkspace
    build:
      context: .
      dockerfile: Dockerfile
      target: devcontainer
    
    volumes:
      - ..:/workspace:cached
      - bashhistory:/commandhistory:rw
      - clibs:/clib
      # --- Physical Host Bind Mounts to /clib ---
      - type: bind
        source: C:/Program Files/Microsoft Visual Studio
        target: /clib/msvc
        read_only: true
        
      # 2. Windows SDK (Universal C Runtime / UCRT headers)
      - type: bind
        source: C:/Program Files (x86)/Windows Kits/10
        target: /clib/windows_kits
        read_only: true
        
      # 3. Dedicated custom library folder for Boost (futureproof; use as needed)
      - type: bind
        source: C:/Users/votha/clib
        target: /clib/dst
        read_only: false
    
    command: sleep infinity

  sandbox:
    container_name: devtest
    image: devtest
    build: 
      context: .
      dockerfile: Dockerfile
      target: sandbox

    depends_on:
      - workspace
    environment:
      - TARGET_EXE=${TARGET_EXE:-}

    develop:
      watch:
        - path: ../build
          action: sync+exec
          target: /sandbox_workspace/build
          exec:
            command: >
              bash -c '
              if [ -z "$$TARGET_EXE" ]; then 
                echo "No TARGET_EXE is set. Skipping execution." ; 
                exit 0 ; 
              fi ; 
              wine "/sandbox_workspace/$$TARGET_EXE"'
    volumes:
      - ..:/sandbox_workspace
      
      # --- Sandbox Read-Only Library Access ---
      - type: bind
        source: C:/Program Files/Microsoft Visual Studio
        target: /clib/msvc
        read_only: true

      - type: bind
        source: C:/Program Files (x86)/Windows Kits/10
        target: /clib/windows_kits
        read_only: true

      - type: bind
        source: C:/Users/votha/clib
        target: /clib/dst
        read_only: true # Strictly RO for the sandbox
    
    command: >
      bash -c "
      echo \"--- Executing $${TARGET_EXE} in WINE Sandbox ---\" &&
      wine /sandbox_workspace/$${TARGET_EXE}
      "

volumes:
  bashhistory:   
  clibs:
